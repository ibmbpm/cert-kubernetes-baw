              number: 4300

---
# 6. ID PROVIDER (WITH TRANSFORM) - Identity Provider with URL Rewriting
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cncf-platform-id-provider
  namespace: BAW_NAMESPACE
  annotations:
    alb.ingress.kubernetes.io/group.name: cpd-alb-group
    alb.ingress.kubernetes.io/certificate-arn: IAM_CERT_ARN
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
    alb.ingress.kubernetes.io/healthcheck-port: "4300"
    alb.ingress.kubernetes.io/group.order: "5"
    alb.ingress.kubernetes.io/transforms.platform-identity-provider: >
      [{"type": "url-rewrite", "urlRewriteConfig": {"rewrites": [{"regex": "^/idprovider/?(.*)$", "replace": "/$1"}]}}]
spec:
  ingressClassName: alb
  rules:
  - host: DOMAIN_NAME
    http:
      paths:
      - path: /idprovider
        pathType: Prefix
        backend:
          service:
            name: platform-identity-provider
            port:
              number: 4300

