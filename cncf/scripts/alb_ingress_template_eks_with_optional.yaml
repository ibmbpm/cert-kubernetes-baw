---
# AWS ALB Ingress Template for IBM Business Automation Workflow (BAW) Standalone on EKS
# WITH OPTIONAL COMPONENTS (OpenSearch and Kafka)
#
# This template includes:
# - All base BAW services (10 Ingress resources)
# - OpenSearch dashboard and API endpoints
# - Kafka broker access (if using ALB approach)
#
# Prerequisites:
# - AWS Load Balancer Controller v2.14+ installed
# - IAM certificate uploaded to AWS IAM
# - IngressClass 'alb' available in cluster
# - For OpenSearch: ICP4ACluster CR must have sc_ingress_type: gatewayapi or loadbalancer
# - For Kafka: ICP4ACluster CR must have sc_ingress_type: loadbalancer

---
# 1. ZEN ROOT (CATCH-ALL) - Main BAW Console Entry Point
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zen-ingress
  namespace: BAW_NAMESPACE
  annotations:
    alb.ingress.kubernetes.io/group.name: cpd-alb-group
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/certificate-arn: IAM_CERT_ARN
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=180
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
    alb.ingress.kubernetes.io/healthcheck-port: "443"
    alb.ingress.kubernetes.io/group.order: "9"
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=172800
spec:
  ingressClassName: alb
  rules:
  - host: DOMAIN_NAME
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ibm-nginx-svc
            port:
              number: 443

---
# 2. SOCIAL LOGIN - OAuth/OIDC Social Login Callback
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cncf-social-login-callback
  namespace: BAW_NAMESPACE
  annotations:
    alb.ingress.kubernetes.io/group.name: cpd-alb-group
    alb.ingress.kubernetes.io/certificate-arn: IAM_CERT_ARN
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTPS
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTPS
    alb.ingress.kubernetes.io/healthcheck-port: "9443"
    alb.ingress.kubernetes.io/group.order: "1"
spec:
  ingressClassName: alb
  rules:
  - host: DOMAIN_NAME
    http:
      paths:
      - path: /ibm/api/social-login
        pathType: Prefix
        backend:
          service:
            name: platform-auth-service
            port:
              number: 9443

---
# 3. SAML UI - SAML Authentication Callback
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
