# GKE Ingress Template for BAW Standalone Deployment
# This template uses GKE's built-in GCE Ingress Controller
# Note: GKE Ingress provisions Google Cloud HTTP(S) Load Balancer (Layer 7)

kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: gke-social-login-callback
  namespace: NAMESPACE
spec:
  ingressClassName: gce
  rules:
    - host: HOST
      http:
        paths:
          - path: /ibm/api/social-login/*
            pathType: ImplementationSpecific
            backend:
              service:
                name: platform-auth-service
                port:
                  number: 9443
---
