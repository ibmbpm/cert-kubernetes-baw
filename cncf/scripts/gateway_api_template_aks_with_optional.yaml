# Gateway API Template for AKS (With OpenSearch and Kafka)
# This template includes OpenSearch and Kafka configurations
# Placeholders: NAMESPACE, HOST, DOMAIN, CLIENT_ID, LICENSING_NS

---
# Certificate for auth hostname
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: NAMESPACE-baw-auth-gateway-tls
  namespace: NAMESPACE
spec:
  secretName: cp-console-gateway-tls-secret
  issuerRef:
    name: zen-tls-issuer
    kind: Issuer
  dnsNames:
    - NAMESPACE-cpd.DOMAIN
  usages:
    - digital signature
    - key encipherment
    - server auth

---
# Certificate for licensing hostname
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: NAMESPACE-licensing-gateway-tls
  namespace: NAMESPACE
spec:
  secretName: licensing-gateway-tls-secret
  issuerRef:
    name: zen-tls-issuer
    kind: Issuer
  dnsNames:
    - licensing.DOMAIN
  usages:
    - digital signature
    - key encipherment
    - server auth

---
# Certificate for OpenSearch hostname
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: NAMESPACE-opensearch-gateway-tls
  namespace: NAMESPACE
spec:
  secretName: opensearch-gateway-tls-secret
  issuerRef:
    name: zen-tls-issuer
    kind: Issuer
  dnsNames:
    - opensearch-NAMESPACE.DOMAIN
  usages:
    - digital signature
    - key encipherment
    - server auth

---
# Certificate for cpd-ingress-tls-secret (consumed by CPD pods)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: NAMESPACE-cpd-ingress-tls
  namespace: NAMESPACE
spec:
  secretName: cpd-ingress-tls-secret
  issuerRef:
    name: zen-tls-issuer
    kind: Issuer
  dnsNames:
    - NAMESPACE-cpd.DOMAIN
  usages:
    - digital signature
    - key encipherment
    - server auth

---
# Non-headless Service wrapper for OpenSearch
# The OpenSearch operator creates headless Services (ClusterIP: None) which AGC cannot use
# as backends — it requires a ClusterIP service to resolve endpoints. This wrapper selects
# the same pods and gives AGC a routable ClusterIP.
apiVersion: v1
kind: Service
metadata:
  name: NAMESPACE-opensearch-svc
  namespace: NAMESPACE
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 9200
      protocol: TCP
      targetPort: 9200
      appProtocol: HTTPS
  selector:
    cluster.opensearch.cloudpackopen.ibm.com: opensearch

---
# BackendTLSPolicy for OpenSearch
# No verify block: AGC does not support private CA cert verification for backend TLS.
# Targets the non-headless wrapper service, not the headless opensearch service.
apiVersion: alb.networking.azure.io/v1
kind: BackendTLSPolicy
metadata:
  name: NAMESPACE-opensearch-tls
  namespace: NAMESPACE
spec:
  targetRef:
    group: ""
    kind: Service
    name: NAMESPACE-opensearch-svc
  default:
    sni: opensearch.NAMESPACE.svc
    ports:
      - port: 9200

---
# HealthCheckPolicy for OpenSearch (accepts 401 responses)
# OpenSearch returns 401 on all unauthenticated probes — include it as a healthy status.
# Targets the non-headless wrapper service.
apiVersion: alb.networking.azure.io/v1
kind: HealthCheckPolicy
metadata:
  name: NAMESPACE-opensearch-hc
  namespace: NAMESPACE
spec:
  targetRef:
    group: ""
    kind: Service
    name: NAMESPACE-opensearch-svc
  default:
    interval: 15s
    timeout: 10s
    healthyThreshold: 1
    unhealthyThreshold: 3
    port: 9200
    useTLS: true
    http:
      path: /
      match:
        statusCodes:
          - start: 200
            end: 401

---
# BackendTLSPolicy for platform-auth-service
# verify works here: cs-ca-certificate-secret is the IBM IAM CA and exists in the namespace.
apiVersion: alb.networking.azure.io/v1
kind: BackendTLSPolicy
metadata:
  name: NAMESPACE-platform-auth-tls
  namespace: NAMESPACE
spec:
  targetRef:
    group: ""
    kind: Service
    name: platform-auth-service
  default:
    sni: platform-auth-service
    verify:
      caCertificateRef:
        name: cs-ca-certificate-secret
        group: ""
        kind: Secret
    ports:
      - port: 9443

---
# BackendTLSPolicy for platform-identity-provider
# verify works here: cs-ca-certificate-secret is the IBM IAM CA and exists in the namespace.
apiVersion: alb.networking.azure.io/v1
kind: BackendTLSPolicy
metadata:
  name: NAMESPACE-platform-idprovider-tls
  namespace: NAMESPACE
spec:
  targetRef:
    group: ""
    kind: Service
    name: platform-identity-provider
  default:
    sni: platform-identity-provider
    verify:
      caCertificateRef:
        name: cs-ca-certificate-secret
        group: ""
        kind: Secret
    ports:
      - port: 4300

---
# BackendTLSPolicy for platform-identity-management
# verify works here: cs-ca-certificate-secret is the IBM IAM CA and exists in the namespace.
apiVersion: alb.networking.azure.io/v1
kind: BackendTLSPolicy
metadata:
  name: NAMESPACE-platform-idmgmt-tls
  namespace: NAMESPACE
spec:
  targetRef:
    group: ""
    kind: Service
    name: platform-identity-management
  default:
    sni: platform-identity-management
    verify:
      caCertificateRef:
        name: cs-ca-certificate-secret
        group: ""
        kind: Secret
    ports:
      - port: 4500

---
# BackendTLSPolicy for ibm-nginx-svc
# NOTE: port must be the pod's TLS port (8443), not the service virtual port (443).
# AGC bypasses kube-proxy and connects directly to pod endpoints.
# No verify block: AGC does not support private CA cert verification for backend TLS.
apiVersion: alb.networking.azure.io/v1
kind: BackendTLSPolicy
metadata:
  name: NAMESPACE-ibm-nginx-tls
  namespace: NAMESPACE
spec:
  targetRef:
    group: ""
    kind: Service
    name: ibm-nginx-svc
  default:
    sni: cpd
    ports:
      - port: 8443

---
# HealthCheckPolicy for ibm-nginx-svc
# ibm-nginx returns 303 on / — AGC marks backend unhealthy unless probed at /zen/ (returns 200).
apiVersion: alb.networking.azure.io/v1
kind: HealthCheckPolicy
metadata:
  name: NAMESPACE-ibm-nginx-hc
  namespace: NAMESPACE
spec:
  targetRef:
    group: ""
    kind: Service
    name: ibm-nginx-svc
    namespace: NAMESPACE
  default:
    healthyThreshold: 2
    unhealthyThreshold: 3
    interval: 5s
    timeout: 3s
    port: 8443
    useTLS: true
    http:
      path: /zen/
      match:
        statusCodes:
          - start: 200
            end: 399

---
# BackendTLSPolicy for licensing service
# No verify block: AGC does not support private CA cert verification for backend TLS.
apiVersion: alb.networking.azure.io/v1
kind: BackendTLSPolicy
metadata:
  name: LICENSING_NS-licensing-tls
  namespace: LICENSING_NS
spec:
  targetRef:
    group: ""
    kind: Service
    name: ibm-licensing-service-instance
    namespace: LICENSING_NS
  default:
    sni: ibm-licensing-service-instance.LICENSING_NS.svc
    ports:
      - port: 8080

---
# Gateway with HTTP and HTTPS listeners (including OpenSearch)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: NAMESPACE-baw-auth-gateway
  namespace: NAMESPACE
  annotations:
    alb.networking.azure.io/alb-name: ALB_NAME
    alb.networking.azure.io/alb-namespace: NAMESPACE
  labels:
    app: baw-auth-gateway
spec:
  gatewayClassName: GATEWAY_CLASS
  listeners:
    # HTTP listener (for redirect)
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - kind: HTTPRoute

    # HTTPS listener for CPD / Auth traffic
    - name: https
      protocol: HTTPS
      port: 443
      hostname: NAMESPACE-cpd.DOMAIN
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: cp-console-gateway-tls-secret
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute

    # HTTPS listener for Licensing (cross-namespace)
    - name: https-licensing
      protocol: HTTPS
      port: 443
      hostname: licensing.DOMAIN
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: licensing-gateway-tls-secret
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: LICENSING_NS
        kinds:
          - kind: HTTPRoute

    # HTTPS listener for OpenSearch
    - name: https-opensearch
      protocol: HTTPS
      port: 443
      hostname: opensearch-NAMESPACE.DOMAIN
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: opensearch-gateway-tls-secret
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute

---
# ReferenceGrant for cross-namespace licensing route
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: NAMESPACE-allow-licensing-to-gateway
  namespace: NAMESPACE
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: LICENSING_NS
  to:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: NAMESPACE-baw-auth-gateway

---
# HTTPRoute: /idauth → platform-auth-service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: NAMESPACE-cncf-platform-id-auth
  namespace: NAMESPACE
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      sectionName: https
  hostnames:
    - "NAMESPACE-cpd.DOMAIN"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /idauth
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: platform-auth-service
          port: 9443

---
# HTTPRoute: /idprovider → platform-identity-provider
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: NAMESPACE-cncf-platform-id-provider
  namespace: NAMESPACE
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      sectionName: https
  hostnames:
    - "NAMESPACE-cpd.DOMAIN"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /idprovider
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: platform-identity-provider
          port: 4300

---
# HTTPRoute: /login → platform-identity-provider
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: NAMESPACE-cncf-platform-login
  namespace: NAMESPACE
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      sectionName: https
  hostnames:
    - "NAMESPACE-cpd.DOMAIN"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /login
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: platform-identity-provider
          port: 4300

---
# HTTPRoute: /v1/auth → platform-identity-provider
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: NAMESPACE-cncf-platform-auth
  namespace: NAMESPACE
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      sectionName: https
  hostnames:
    - "NAMESPACE-cpd.DOMAIN"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/auth
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: platform-identity-provider
          port: 4300

---
# HTTPRoute: /idmgmt → platform-identity-management
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: NAMESPACE-cncf-id-mgmt
  namespace: NAMESPACE
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      sectionName: https
  hostnames:
    - "NAMESPACE-cpd.DOMAIN"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /idmgmt
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: platform-identity-management
          port: 4500

---
# HTTPRoute: /oidc → platform-auth-service (no rewrite)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: NAMESPACE-cncf-platform-oidc
  namespace: NAMESPACE
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      sectionName: https
  hostnames:
    - "NAMESPACE-cpd.DOMAIN"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /oidc
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
      backendRefs:
        - name: platform-auth-service
          port: 9443

---
# HTTPRoute: SAML callback (no rewrite)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: NAMESPACE-cncf-saml-ui-callback
  namespace: NAMESPACE
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      sectionName: https
  hostnames:
    - "NAMESPACE-cpd.DOMAIN"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ibm/saml20/defaultSP/acs
      backendRefs:
        - name: platform-auth-service
          port: 9443

---
# HTTPRoute: Social login callback (no rewrite)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: NAMESPACE-cncf-social-login-callback
  namespace: NAMESPACE
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      sectionName: https
  hostnames:
    - "NAMESPACE-cpd.DOMAIN"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ibm/api/social-login
      backendRefs:
        - name: platform-auth-service
          port: 9443

---
# HTTPRoute: Catch-all / → ibm-nginx-svc (Zen UI)
# port 8443: AGC connects directly to pod port; service must expose 8443 (see patch_services_for_https).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: NAMESPACE-zen-ingress
  namespace: NAMESPACE
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      sectionName: https
  hostnames:
    - "NAMESPACE-cpd.DOMAIN"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ibm-nginx-svc
          port: 8443

---
# HTTPRoute: OpenSearch
# Routes to the non-headless wrapper service, not the headless opensearch service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: NAMESPACE-cncf-opensearch
  namespace: NAMESPACE
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      sectionName: https-opensearch
  hostnames:
    - "opensearch-NAMESPACE.DOMAIN"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: NAMESPACE-opensearch-svc
          port: 9200

---
# HTTPRoute: Licensing service (cross-namespace)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: LICENSING_NS-cncf-ibm-licensing-service-instance
  namespace: LICENSING_NS
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      namespace: NAMESPACE
      sectionName: https-licensing
  hostnames:
    - "licensing.DOMAIN"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ibm-licensing-service-instance
          port: 8080

---
# HTTPRoute: HTTP → HTTPS redirect for auth
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: NAMESPACE-http-to-https-redirect-auth
  namespace: NAMESPACE
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      sectionName: http
  hostnames:
    - "NAMESPACE-cpd.DOMAIN"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
# HTTPRoute: HTTP → HTTPS redirect for OpenSearch
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: NAMESPACE-http-to-https-redirect-opensearch
  namespace: NAMESPACE
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      sectionName: http
  hostnames:
    - "opensearch-NAMESPACE.DOMAIN"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
# HTTPRoute: HTTP → HTTPS redirect for licensing
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: LICENSING_NS-http-to-https-redirect-licensing
  namespace: LICENSING_NS
spec:
  parentRefs:
    - name: NAMESPACE-baw-auth-gateway
      namespace: NAMESPACE
      sectionName: http
  hostnames:
    - "licensing.DOMAIN"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

