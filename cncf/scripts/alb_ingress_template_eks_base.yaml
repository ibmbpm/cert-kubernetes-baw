---
# 8b. PLATFORM AUTH OIDC CALLBACK - /auth/login/* OIDC callback routes
# Required: ibm-nginx redirects unauthenticated requests to
# /idprovider/v1/auth/authorize which then issues a successRedirect
# to /auth/login/oidc/callback. This routes through baw-alb-rewrite-proxy
# which has the /auth nginx location block configured to proxy to
# platform-identity-provider:4300 with proper headers and SSL settings.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cncf-platform-auth-login
  namespace: BAW_NAMESPACE
  annotations:
    alb.ingress.kubernetes.io/group.name: cpd-alb-group
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/certificate-arn: IAM_CERT_ARN
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: "80"
    alb.ingress.kubernetes.io/group.order: "75"
    alb.ingress.kubernetes.io/target-group-attributes: stickiness.enabled=true,stickiness.lb_cookie.duration_seconds=172800
spec:
  ingressClassName: alb
  rules:
  - host: DOMAIN_NAME
    http:
      paths:
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: baw-alb-rewrite-proxy
            port:
              number: 80

